#------------------------------------------------------------------------------
# 覆盖率闸门
#------------------------------------------------------------------------------

# 覆盖率硬阈值(低于此值直接拒跑)
# 示例: 0.5, 0.8, 0.99
# 提示:
#   - 覆盖率的定义: 标注文件数 / 图像数(stem 级)
#   - 低于硬阈值 → raise, 不写任何产物(疑似导出中断 / 路径配错)
#   - 调高 = 更严: 例如 0.99 要求几乎每张图都有标注
#   - COCO 是单 json 格式, 跳过 stem 级覆盖率检查
coverage_hard_threshold: 0.5

# 覆盖率软阈值(低于此值只警告)
# 示例: 0.9, 0.95, 1.0
# 提示:
#   - 低于软阈值但高于硬阈值 → 打 WARNING 后继续
#   - 建议 >= 硬阈值(反了只 warn, 软警告永不触发)
#   - 软阈值 = 1.0 表示「只要有缺标注就提醒」
coverage_soft_threshold: 0.9


#------------------------------------------------------------------------------
# 类别平衡报告
#------------------------------------------------------------------------------

# 稀有类预警线(最小 split 的期望样本量)
# 示例: 1.0, 3.0, 5.0
# 提示:
#   - 期望样本量 = 该类出现的图数 × 最小 split 比例
#   - 低于此值 → 报告里标「稀有类!」, 只预警不拦截
#   - 调高 = 更早提醒补数据
rare_warn_min_expected: 3.0


#------------------------------------------------------------------------------
# 划分策略
#------------------------------------------------------------------------------

# 训练集比例
# 示例: 0.7, 0.8, 0.9
# 提示:
#   - 默认 8:1:1(train 0.8 / val 0.1 / test 0.1)
#   - test 比例 = 1 - train_rate - val_rate(本模型自动算, 不用配)
#   - train_rate + val_rate 不能超过 1
#   - 小数据集可提高 val_rate 让验证更稳
train_rate: 0.8

# 验证集比例
# 示例: 0.1, 0.15, 0.2
# 提示:
#   - 验证集用于选模型 / 早停, 不能省
#   - 剩余全部进 test(最终诚实评估)
#   - 与 train_rate 之和超过 1 会被直接拒绝
val_rate: 0.1

# 划分随机种子(可复现性)
# 示例: 0, 42, 2026
# 提示:
#   - 同种子 = 同划分(契约指纹可复现的前提)
#   - 换种子 = 换划分, 会换 manifest 指纹
#   - 命令行等价参数是 --seed
random_state: 42

# 划分策略(random / stratified_multilabel)
# 示例: random, stratified_multilabel
# 提示:
#   - 限定取值: random / stratified_multilabel
#   - random: 纯随机洗牌, 不需要标签
#   - stratified_multilabel: 多标签分层, 稀有类也能进每个 split
#   - 命令行等价参数是 --split-strategy
split_strategy: random


#------------------------------------------------------------------------------
# 转换选项
#------------------------------------------------------------------------------

# 类别白名单(None=按数据自带; [] = 全排除)
# 示例: None, ['head', '反光衣'], ['defect']
# 提示:
#   - None: 按数据自带顺序(原样保留类别)
#   - list: 只保留这些类, 顺序即 class_id(会重排!)
#   - [] 空列表: 全排除(常用于先看清有什么类再决定)
#   - 命令行等价参数是 --classes
classes: null


#==============================================================================
# 常见问题
#==============================================================================
#
# Q: 如何修改配置?
# A: 直接编辑对应参数的值, 保存后重新运行即可
#
# Q: 命令行参数会覆盖配置文件吗?
# A: 是的, 命令行参数优先级最高: CLI > YAML > DEFAULT
#
# Q: 如何恢复默认配置?
# A: 删除此文件, 程序会自动报错并提示重新生成
#
# Q: 如何用新版默认值重新生成此模板?
# A: 跑 'odp-gen-config <name> --overwrite' (会自动备份原文件)
#    备胎(装包前可用): python -m od_platform.runtime_config.generator <name> --overwrite
#
#==============================================================================