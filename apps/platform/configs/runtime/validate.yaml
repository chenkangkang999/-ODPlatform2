#==============================================================================
# 数据质检配置(odp-validate)
# 自动生成时间: 2026-10-27 13:34:17
#==============================================================================


#------------------------------------------------------------------------------
# 配对与覆盖率
#------------------------------------------------------------------------------

# 缺标签占比 ERROR 线
# 示例: 0.3, 0.5, 0.8
# 提示:
#   - 缺标签图占比 >= 此值 → ERROR(疑似导出中断, 必须修)
#   - 建议 >= pair_missing_warn_ratio(反了只 warn: WARNING 档永远轮不到)
#   - 调低 = 更严: 少量缺失就升级成 ERROR
pair_missing_error_ratio: 0.5

# 缺标签占比 WARNING 线
# 示例: 0.01, 0.05, 0.1
# 提示:
#   - 占比 >= 此值(且 < ERROR 线) → WARNING
#   - 低于此值但有缺失 → INFO(多为无目标图, 确认即可)
#   - 0 表示「一张都不许缺」
pair_missing_warn_ratio: 0.05

# 无标注图占比 WARNING 线
# 示例: 0.2, 0.3, 0.5
# 提示:
#   - 无有效标注(标签文件为空/无有效行)的图占比 >= 此值 → WARNING
#   - 与 pair_existence 的分工: 那边看「文件在不在」, 这边看「里面有没有东西」
#   - 建议 >= unlabeled_info_ratio(反了只 warn: INFO 档永远轮不到)
unlabeled_warn_ratio: 0.3

# 无标注图占比 INFO 线
# 示例: 0.0, 0.05, 0.1
# 提示:
#   - 占比 >= 此值(且 < WARNING 线) → INFO
#   - 低于此值 → PASS
#   - 空图(背景图)本身是合法的, 所以这里不设 ERROR
unlabeled_info_ratio: 0.05

# 孤儿标签占比 WARNING 线
# 示例: 0.05, 0.1, 0.3
# 提示:
#   - 孤儿标签 = 有 .txt 没有对应图像
#   - 占比 >= 此值 → WARNING(疑似图被删了)
#   - 低于此值但有孤儿 → INFO
orphan_labels_warn_ratio: 0.1


#------------------------------------------------------------------------------
# 边界框几何
#------------------------------------------------------------------------------

# 出界框占比 ERROR 线
# 示例: 0.01, 0.1, 0.5
# 提示:
#   - 出界框(cx±w/2 超出 [0,1])占比 >= 此值 → ERROR, 否则 WARNING
#   - 调低 = 更严: 极少数越界框也会被升级成 ERROR
#   - 只适用 detect; segment 的多边形顶点允许在外
bbox_out_error_ratio: 0.1

# 出界判定浮点容差
# 示例: 0.0, 1e-06, 0.001
# 提示:
#   - 归一化坐标的小数误差不该被当成「越界」
#   - 出界量 <= 此容差 → 视为没出界
#   - 一般不要改(1e-6 足够吃掉浮点噪声)
bbox_edge_tolerance: 1.0e-06

# 退化框最小宽/高
# 示例: 0.0001, 0.001, 0.01
# 提示:
#   - 归一化 w 或 h 低于此值 → 记一个 tiny_area 退化框
#   - w<=0 / h<=0 会先被 zero_width / zero_height 抓走
#   - 该 check 只出 WARNING(可训但建议清理)
degenerate_box_min_size: 0.001

# 极端宽高比判定线
# 示例: 10.0, 20.0, 50.0
# 提示:
#   - 宽高比 max(w/h, h/w) >= 此值 → 极端形状(细长条)
#   - 细长缺陷(裂缝/划痕)是合法数据, 所以只出 WARNING
#   - D3 的只读报告与 D4 共用这一个常量口径
stats_max_aspect_ratio: 20.0


#------------------------------------------------------------------------------
# 类别分布
#------------------------------------------------------------------------------

# 类别失衡比 WARNING 线
# 示例: 20.0, 50.0, 100.0
# 提示:
#   - 失衡比 = 最多类实例数 / 最少类实例数(只看非零类)
#   - >= 此值 → WARNING(长尾提醒, 建议关注 class_weights / 重采样)
#   - 建议 >= class_imbalance_info_ratio(反了只 warn: INFO 档永远轮不到)
stats_max_imbalance_ratio: 50.0

# 类别失衡比 INFO 线
# 示例: 5.0, 10.0, 20.0
# 提示:
#   - 失衡比 >= 此值(且 < WARNING 线) → INFO
#   - 低于此值 → PASS(未见显著失衡)
#   - 建议 > 1(比值小于 1 没有意义)
class_imbalance_info_ratio: 10.0


#------------------------------------------------------------------------------
# 划分规模
#------------------------------------------------------------------------------

# split 规模提示线(图数)
# 示例: 10, 30, 100
# 提示:
#   - 某个 split 的图数低于此值 → INFO(评估方差偏大)
#   - 只提示不拦截: 小数据集本来就凑不够
#   - train 缺失才是 ERROR, 与这个数字无关
split_min_images: 30


#------------------------------------------------------------------------------
# 明细展示上限
#------------------------------------------------------------------------------

# 缺失清单展示上限(条)
# 示例: 5, 20, 100
# 提示:
#   - details.missing_preview 最多列这么多条, 避免报告爆掉
#   - 0 表示只报汇总数字, 不列清单
#   - 只影响报告体积, 不影响判定
pair_max_detail: 20

# 契约核验清单展示上限(条)
# 示例: 5, 20, 100
# 提示:
#   - changed / moved / missing 三个清单各自的上限
#   - 计数是全量的, 只有清单被截断
#   - 0 表示只报计数, 不列样本名
lineage_max_detail: 20

# details 预览统一上限(条)
# 示例: 5, 20, 50
# 提示:
#   - label_format / bbox_within_image / box_geometry / duplicate_annotations / orphan_labels / split_uniqueness / stem_collision / image_integrity 共用
#   - 统一一个数字, 免得每份 report 预览长度都不一样
#   - 只影响报告体积, 不影响判定
details_preview_limit: 20


#------------------------------------------------------------------------------
# 图像完整性
#------------------------------------------------------------------------------

# 坏图占比 ERROR 线
# 示例: 0.0, 0.01, 0.05
# 提示:
#   - 无法解码的图(0 字节 / 截断 / 伪装扩展名)占比 >= 此值 → ERROR
#   - 默认 0.0: 一张坏图就算 ERROR —— 坏图会让训练 dataloader 直接崩
#   - 调高 = 更宽容: 少量坏图降级为 WARNING
image_integrity_error_ratio: 0.0


#==============================================================================
# 常见问题
#==============================================================================
#
# Q: 如何修改配置?
# A: 直接编辑对应参数的值, 保存后重新运行即可
#
# Q: 命令行参数会覆盖配置文件吗?
# A: 是的, 命令行参数优先级最高: CLI > YAML > DEFAULT
#
# Q: 如何恢复默认配置?
# A: 删除此文件, 程序会自动报错并提示重新生成
#
# Q: 如何用新版默认值重新生成此模板?
# A: 跑 'odp-gen-config <name> --overwrite' (会自动备份原文件)
#    备胎(装包前可用): python -m od_platform.runtime_config.generator <name> --overwrite
#
#==============================================================================