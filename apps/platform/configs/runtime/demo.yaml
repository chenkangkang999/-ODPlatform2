#------------------------------------------------------------------------------
# 界面设置
#------------------------------------------------------------------------------

# 演示界面标题
# 示例: ODPlatform · odp-demo 目标检测演示, 鱼类细分类检测演示
# 提示:
#   - 显示在界面顶部的标题(也作为浏览器标签标题)
#   - 改这里不影响任何推理行为
title: ODPlatform · odp-demo 目标检测演示

# 界面绑定地址(127.0.0.1=仅本机)
# 示例: 127.0.0.1, 0.0.0.0
# 提示:
#   - 127.0.0.1: 只有本机能访问(默认, 演示/开发用)
#   - 0.0.0.0: 局域网内其它机器也能访问(对外演示时才用)
server_name: 127.0.0.1

# 界面监听端口
# 示例: 7860, 7861, 8000
# 提示:
#   - 被占用时换一个端口, 或用 --server-port 传入
#   - 端口 < 1024 在 Linux 上需要 root, 不建议
server_port: 7860

# 是否生成公网分享链接(会经过第三方服务)
# 示例: False, True
# 提示:
#   - True: gradio 生成一个临时公网链接(会经过第三方服务, 慎用)
#   - False: 只有本机/局域网访问
share: false

# 启动后是否自动打开浏览器
# 示例: False, True
# 提示:
#   - False: 手动打开终端打印出来的 URL(服务器/CI 环境必须 False)
#   - True: 本机演示图省事
inbrowser: false

# 单次最多处理几张图片
# 示例: 1, 4, 8, 16
# 提示:
#   - 一次点'开始检测'最多跑几张图(防止误传几百张把显存/内存顶爆)
#   - 超出的部分会被截断, 并在结果区给出提示
max_images: 8


#------------------------------------------------------------------------------
# 权重与绘制
#------------------------------------------------------------------------------

# 默认权重名(按 common/refs.py 的搜索顺序解析, 不写盘符/绝对路径)
# 示例: train-20261027-124755-fish-yolo11n-best, yolo11n, train-20261027-121740-synth-yolo11n-best
# 提示:
#   - 只写【名字】(可带或不带 .pt 后缀): 由 common/refs.py 依次在 models/trained → models/pretrained → models/checkpoints 里找
#   - 默认值 = 本仓库已训好的 fish(BengalDeltaFish 33 类)权重
#   - 界面上可以随时换成下拉里的其它权重, 也可以直接输入名字
#   - 留空(null)时退化成'第一个可用的已训练权重'
weight: train-20261027-124755-fish-yolo11n-best

# 美化/帧源配置(None=用与 odp-infer 同一个默认落点)
# 示例: None, infer_pipeline, infer_pipeline.yaml
# 提示:
#   - None: 用 defaults 里与 odp-infer 完全相同的落点 (paths.runtime_config_path('infer_pipeline'))
#   - 配色/标签映射/字体/美化开关都读这份 yaml 的 visualization 段, 界面代码里不另写一套颜色
#   - 只写名字会补 .yaml 并在 configs/runtime/ 下找; 也可给路径
pipeline_yaml: null


#==============================================================================
# 常见问题
#==============================================================================
#
# Q: 如何修改配置?
# A: 直接编辑对应参数的值, 保存后重新运行即可
#
# Q: 命令行参数会覆盖配置文件吗?
# A: 是的, 命令行参数优先级最高: CLI > YAML > DEFAULT
#
# Q: 如何恢复默认配置?
# A: 删除此文件, 程序会自动报错并提示重新生成
#
# Q: 如何用新版默认值重新生成此模板?
# A: 跑 'odp-gen-config <name> --overwrite' (会自动备份原文件)
#    备胎(装包前可用): python -m od_platform.runtime_config.generator <name> --overwrite
#
#==============================================================================