# ============================================================
# 模型评估 —— odp-eval 的唯一配置源
#
# ★ 每一项都对应 od_platform/evaluation/settings.py 里 EvalSettings 的一个字段,
#   键名与字段同名。想知道"能调什么"看那边; 想知道"这次按什么在跑"看报告里的 settings 块。
# ★ 下面这些值就是出厂默认值 —— 有一条测试专门守「示例配置 == 代码默认值」,
#   防止两边悄悄漂移（配置写一套、代码跑另一套是最难查的那类问题）。
# ============================================================

evaluation:
  # ---------- 评估哪个 split ----------
  split: val

  # ---------- 推理参数 ----------
  imgsz: 640            # 评估输入边长（必须是 32 的倍数）
  batch: 8              # 每批图片数; -1 = 自动
  device: cpu           # ★ 默认 cpu: 本机显存只有 8GB, 评估不该去抢训练的卡
  workers: 2            # 数据加载进程数
  max_det: 300          # 每图最多保留多少框
  # ★ val 阶段必须用极低阈值, P-R 曲线才是完整的。用 0.25 之类的部署阈值去 val,
  #   会凭空砍掉曲线左半段, 算出来的 mAP 会系统性偏低 —— 这是很常见的误用。
  conf: 0.001
  iou: 0.7              # NMS 的 IoU 阈值（注意：不是 mAP 的 IoU 门限, 两者别混）
  half: false           # 半精度（CPU 上无效）
  plots: false          # 出图交给报告, 不让框架往目录里写一堆文件
  verbose: true

  # ---------- 置信度扫描（决定"部署时用哪个阈值"）----------
  # ★ 实现方式是"逐个阈值各跑一次 val", 代价是 N 倍 val 时间。
  #   为什么不从 P-R 曲线推：框架给的曲线横轴是【召回率】, 没有 conf→R 的对应关系。
  #   嫌慢就用 --no-conf-sweep 关掉。
  conf_sweep: true
  conf_thresholds: [0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.4, 0.5, 0.6, 0.7]
  # 推荐阈值 = 「精度 ≥ target_precision」的前提下召回率最大的那个阈值。
  # 若扫描范围内没有阈值达到该精度, 报告会如实写「目标精度不可达」并给出 F1 最高的作参考。
  target_precision: 0.90

  # ---------- 如实警告的触发线（答辩会被追问的点）----------
  min_images_for_reliable_map: 100     # 验证集少于这么多张 → 警告 mAP 统计不可靠
  min_instances_for_reliable_ap: 100   # 某类真值框少于这么多 → 警告该类 AP 不稳
  imbalance_ratio_warn: 10.0           # 最多类/最少类 的框数比超过它 → 警告会拖低均值

  # ---------- IoU 匹配分析（显式的"框定得多准"口径, 见 evaluation/iou.py）----------
  # ★ 与上面的 iou(NMS 门限)是两件事: 这一项是"要不要额外算一遍匹配式 IoU 分布"。
  #   做法: 用 settings.conf/settings.iou 跑一遍 predict, 同类预测与真值按 IoU 降序贪心
  #   一对一, 统计匹配对的平均/中位数/最小/最大 IoU 与 0.50–1.00 五档直方图。
  #   它给的是"匹配口径"的 P/R/F1, 与官方 mAP 口径并列展示, 两者不可混用。
  #   ★ 注意上面 conf 默认 0.001 是 val 用的极低阈值: 用它跑匹配会让 FP 暴涨、匹配口径
  #     的 P 失真（IoU 分布不受影响）。要看部署阈值的匹配口径, 把 --conf 提到推荐值再跑。
  iou_analysis: true

  # ---------- 报告 ----------
  decimals: 4
  include_pr_curves: true
  pr_curve_points: 200   # 原始曲线是 1000 个点, 采样到这里这么多点写进 json
  limit: 0               # 0=全部; >0 只评前 N 张（仅用于链路冒烟, 报告会标注不代表整体）
  task_label: detect     # 报告目录名: runs/<task_label>_eval/<run_id>/