#==============================================================================
# 运行现场保留策略配置(odp-clean)
# 自动生成时间: 2026-10-27 13:34:17
#==============================================================================


#------------------------------------------------------------------------------
# 保留策略
#------------------------------------------------------------------------------

# 每组至少保留最新的 N 个
# 示例: 1, 5, 10
# 提示:
#   - 按修改时间排序, 最新的 N 个无条件保留(哪怕很旧)
#   - 与 max_age_days 是「或」关系: 满足任一条就保留
#   - 必须 >= 1(0 没有意义: 等于不留)
#   - 命令行等价参数是 --keep-latest
keep_latest: 5

# 多少天内的现场一律不删
# 示例: 7.0, 30.0, 90.0
# 提示:
#   - 按修改时间算: 太新的一律不删(跑得多也不会误删最近的产物)
#   - 0 表示只按 keep_latest 判定(测试/离线巡检常用)
#   - 与 keep_latest 是「或」关系: 满足任一条就保留
#   - 命令行等价参数是 --max-age-days
max_age_days: 30.0


#------------------------------------------------------------------------------
# 豁免名单
#------------------------------------------------------------------------------

# 额外豁免的子目录名(None = 不额外豁免)
# 示例: None, ['golden_set'], ['golden_set', 'handcheck']
# 提示:
#   - None / []: 只豁免 lineage(硬编码的出身链目录)
#   - list: 这些组名下的现场一律不进清理计划
#   - runs/lineage 无论如何都删不掉 —— 它不靠这里配
#   - 命令行等价参数是 --protect
protect: null


#==============================================================================
# 常见问题
#==============================================================================
#
# Q: 如何修改配置?
# A: 直接编辑对应参数的值, 保存后重新运行即可
#
# Q: 命令行参数会覆盖配置文件吗?
# A: 是的, 命令行参数优先级最高: CLI > YAML > DEFAULT
#
# Q: 如何恢复默认配置?
# A: 删除此文件, 程序会自动报错并提示重新生成
#
# Q: 如何用新版默认值重新生成此模板?
# A: 跑 'odp-gen-config <name> --overwrite' (会自动备份原文件)
#    备胎(装包前可用): python -m od_platform.runtime_config.generator <name> --overwrite
#
#==============================================================================