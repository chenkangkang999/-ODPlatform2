# apps/platform/pyproject.toml
# =============================================================================
# ODPlatform - platform 端配置 (hatchling backend)
# =============================================================================

[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"


[project]
name = "od-platform"
dynamic = ["version"]                              # 版本号从 _version.py 动态读
description = "ODPlatform - 目标检测开发平台核心引擎"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "ODPlatform Team" },
]
keywords = ["object-detection", "yolo", "deep-learning", "ml-platform"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "colorlog>=6.7.0",
    "psutil>=5.9.0",
    "torch>=2.0.0",
    "ultralytics>=8.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.5,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.4.0",
]
# odp-demo 的界面依赖。★ 可选: 引擎本体(torch/ultralytics/pydantic)不需要它,
# CI 也不装它 —— visualization/gradio_app.py 顶层不 import gradio(main() 里才延迟 import),
# 所以 `pip install -e "apps/platform[dev]"` 之后 pytest 照样全绿。
ui = [
    "gradio>=4.0",
]


# =============================================================================
# Entry-point Scripts (PEP 621 标准字段, 与 backend 无关)
# =============================================================================
[project.scripts]
odp-init = "od_platform.cli.init_project:initialize_project"
odp-reset = "od_platform.cli.reset_project:main"
odp-transform = "od_platform.cli.transform_data:main"
odp-validate = "od_platform.cli.validate_data:main"
odp-gen-config = "od_platform.runtime_config.generator:main"
odp-train = "od_platform.cli.train_model:main"
odp-infer = "od_platform.cli.infer:main"
odp-eval = "od_platform.cli.evaluate_model:main"
odp-clean = "od_platform.cli.clean_runs:main"
# Gradio 演示界面(需要可选依赖 [ui]; 未装 gradio 时 main() 给中文提示并以非 0 退出码结束)
odp-demo = "od_platform.visualization.gradio_app:main"


# =============================================================================
# Hatchling 配置 (告诉它两件事: 包源码在哪、版本号从哪读)
# =============================================================================

# 告诉 hatchling 包源码在 src/od_platform/
[tool.hatch.build.targets.wheel]
packages = ["src/od_platform"]

# 动态版本号: 从 src/od_platform/_version.py 的 __version__ 读
[tool.hatch.version]
path = "src/od_platform/_version.py"


# =============================================================================
# 注意: 这里【不】再放 [tool.pytest.ini_options]
#
# 本仓库的 pytest 配置只有一处 —— 仓库根 pyproject.toml 的 [tool.pytest.ini_options]
# (testpaths / markers / addopts / filterwarnings 全在那儿)。
#
# 曾经这里也有一份, 后果是两份配置互相遮盖(按"离测试最近的 inifile 生效"规则, 从仓库根
# 跑 pytest 时生效的是这一份): 仓库根声明的 markers 失效 → 测试里写 @pytest.mark.unit
# 直接 collection error。这正是 ADR-006「一切皆配置」要消灭的"同一默认值存在多处"。
#
# 从 apps/platform 目录跑 pytest 时, pytest 会自动向上找到仓库根的 pyproject.toml,
# 行为与在仓库根执行一致。
# =============================================================================